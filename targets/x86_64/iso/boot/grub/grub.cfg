
set timeout=10
set default=0


insmod vbe
insmod vga
insmod all_video
insmod gfxterm
insmod png


loadfont /boot/grub/fonts/unicode.pf2

# --- Video mode setup ---
set gfxmode=1024x768
set gfxpayload=1024x768
terminal_output gfxterm

set menu_color_normal=black/#FFD84D 
set menu_color_highlight=yellow/#FFD84D 
set menu_color_border=#FFD84D/#FFD84D



background_image /boot/grub/background.png




# --- Optional: set menu geometry (centered look) ---
set menu_width=60
set menu_height=10
set menu_margin=10

# --- Title / Header ---
echo ""
echo "=============================================="
echo "         🍌  Welcome to PazhamOS  🍌          "
echo "=============================================="
echo ""
echo "   Use ↑↓ to select your boot mode."
echo ""

# --- Boot menu entries ---
menuentry "🍌 PazhamOS (Normal)" {
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "🍌 PazhamOS (Safe Mode)" {
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "🍌 PazhamOS (Debug Mode)" {
    multiboot2 /boot/kernel.bin
    boot
}

# --- Optional Footer ---
echo ""
echo "   © 2025 PazhamOS — Smooth Banana Bootloader 🍌"
echo ""
